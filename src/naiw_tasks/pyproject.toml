[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "naiw_tasks"
version = "0.1.0"
description = "NAIW controller — start/attach/finish hardened per-task Docker sessions."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "click>=8.2,<9",
    "docker>=7.1,<8",
    "PyYAML>=6.0,<7",
    "naiw_common>=0.1.0",
]

[project.scripts]
naiw-tasks = "naiw_tasks.cli:cli"

[tool.setuptools]
packages = ["naiw_tasks"]
