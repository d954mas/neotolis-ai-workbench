name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # Editable installs of the three in-tree packages so their transitive
        # deps (click, docker, PyYAML) are resolved from each pyproject.toml —
        # the source of truth — instead of being hand-maintained here.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest \
            -e ./src/naiw_common \
            -e ./src/naiw_signal \
            -e ./src/naiw_tasks

      - name: ruff
        run: ruff check src/ tests/

      - name: pytest (unit)
        run: pytest tests/unit/ -q

  smoke:
    runs-on: ubuntu-latest
    # Image builds here are layer-cached for CI speed (GHA backend, ~7-day
    # automatic eviction picks up Debian security patches roughly weekly).
    # Production deploys MUST rebuild from master with --no-cache so an
    # operator-driven release isn't pinned to a stale apt snapshot.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + naiw_tasks (for transitive PyYAML)
        # tests/smoke/test_compose_contract.py imports yaml. Rather than
        # hand-pin pyyaml here and risk version drift from
        # src/naiw_tasks/pyproject.toml, install the package editable so its
        # declared dependencies (PyYAML, click, docker, naiw_common) are
        # resolved from the single source of truth — same pattern as the
        # lint-and-test job below.
        run: |
          python -m pip install --upgrade pip
          pip install pytest \
            -e ./src/naiw_common \
            -e ./src/naiw_tasks

      - name: Verify docker tooling
        run: |
          docker --version
          docker compose version

      - name: Read PI_VERSION
        id: pi
        run: echo "version=$(cat image/PI_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build naiw-task-image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          tags: |
            naiw-task-image:0.1.0
            naiw-task-image:latest
          build-args: |
            PI_VERSION=${{ steps.pi.outputs.version }}
            NAIW_VERSION=0.1.0
            NAIW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build naiw-controller (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/controller.Dockerfile
          tags: |
            naiw-controller:0.1.0
            naiw-controller:latest
          build-args: |
            NAIW_VERSION=0.1.0
            NAIW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=naiw-controller
          cache-to: type=gha,mode=max,scope=naiw-controller
          load: true

      - name: Proxy smoke (no pytest wrapper)
        run: bash tests/smoke/run-proxy-smoke.sh

      # Production compose pins naiw-controller by sha256 (.github/workflows/build-images.yml
      # from Phase 3.5 P05). For CI we test the just-built local image instead. The override
      # drops `image:` back to the local-build tag; everything else (hardening, networks,
      # volumes, env) inherits from deploy/docker-compose.yml via compose's standard override
      # merging triggered by the COMPOSE_FILE env var on the next step. The
      # run-containerized-smoke.sh harness (Phase 3.5 P06) reads $COMPOSE_FILE and passes
      # no `-f` flag in that case — docker compose merges the two files natively.
      - name: Override controller image in compose for CI (local build)
        run: |
          cat > deploy/compose.override.yml <<'OVR'
          services:
            naiw-controller:
              image: naiw-controller:latest
          OVR

      # pytest -m smoke runs test_image.py, test_hardened.py, and
      # test_containerized.py — each invokes its bash harness via subprocess.
      # One step verifies both the bash scripts AND the pytest wrappers — no
      # duplication. COMPOSE_FILE env stacks the local-build override on top
      # of the production compose file; the containerized harness omits its
      # own `-f` when this env is set so the stacking actually takes effect.
      - name: Image + hardened + containerized smoke via pytest
        env:
          COMPOSE_FILE: deploy/docker-compose.yml:deploy/compose.override.yml
        run: pytest tests/smoke/ -v -m smoke
