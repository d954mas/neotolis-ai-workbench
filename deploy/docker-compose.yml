# naiw-docker-proxy — locked Docker socket proxy.
# Five Tecnativa env vars set to "1" (the allowlist); every other documented var
# explicitly "0" (paranoid-explicit). Adding a new env var set to "1" requires
# updating the rationale in deploy/proxy/README.md.
#
# Networks:
#   naiw-internal — proxy lives here. Internal management network.
#   naiw-task-net — task containers run here when started by the controller.
#                   Defined here (not just created ad-hoc in smoke scripts) so
#                   a fresh `docker compose up -d` provisions BOTH networks
#                   and the first real `naiw-tasks start` cannot fail with
#                   "network naiw-task-net not found".

networks:
  naiw-internal:
    name: naiw-internal
    driver: bridge
  naiw-task-net:
    # Task containers join this network. Proxy is NOT on it (task containers
    # must never reach the docker daemon). NOTE: no service in this compose
    # file references naiw-task-net, so `compose up -d <service>` will NOT
    # create it on demand. scripts/install-wrapper.sh creates the network
    # idempotently at install time so the first `naiw-tasks start` succeeds.
    name: naiw-task-net
    driver: bridge

services:
  naiw-docker-proxy:
    # Pin by sha256, never by tag. To refresh:
    #   docker pull tecnativa/docker-socket-proxy:v0.4.2
    #   docker inspect --format='{{index .RepoDigests 0}}' tecnativa/docker-socket-proxy:v0.4.2
    # then replace the digest below.
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: naiw-docker-proxy
    restart: unless-stopped
    networks: [naiw-internal]
    # No host port published. Controller is a sibling on `naiw-internal` and
    # reaches the proxy via internal DNS (tcp://naiw-docker-proxy:2375);
    # reachability is network-scoped, not host-scoped. See deploy/proxy/README.md.
    # Socket mounted READ-ONLY.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # ── Locked allowlist. All five MUST stay "1". ──
      CONTAINERS: "1"            # GET /containers/* (list, inspect, logs)
      POST: "1"                  # gates ANY POST/PUT/DELETE; required for stop/start
      ALLOW_START: "1"           # POST /containers/<id>/start
      ALLOW_STOP: "1"            # POST /containers/<id>/stop
      ALLOW_RESTARTS: "1"        # stop/restart/kill (controller `finish` path)
      # ── Everything else explicit "0" (paranoid-explicit). Alphabetical. ──
      # NOTE: pause/unpause are NOT gated by Tecnativa v0.4.2 — no
      # ALLOW_PAUSE/ALLOW_UNPAUSE env-vars; requests pass through to Docker.
      # Acceptable because the controller never pauses task containers
      # (recovery is operator-driven). Revisit if switching to
      # wollomatic/socket-proxy which supports regex allowlisting.
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"                # upstream default 1; we override.
      EXEC: "0"                  # closed permanently. docker attach does NOT need EXEC.
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PING: "0"                  # paranoid-explicit deny of the daemon ping passthrough.
      PLUGINS: "0"
      SECRETS: "0"               # Swarm /secrets/* — unrelated to BuildKit secrets.
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"                 # Swarm tasks — unrelated to NAIW task containers.
      VERSION: "0"               # may flip to "1" if docker-py negotiation fails.
      VOLUMES: "0"
    # No healthcheck. PING=0 makes the proxy correctly return 403 to /_ping, so any
    # HTTP probe would conflict with the allowlist. Recovery is `restart: unless-stopped`.
    # If a downstream service needs `depends_on: { condition: service_healthy }`, use a
    # TCP-level probe (see deploy/proxy/README.md).

  naiw-controller:
    # GHCR-published image, tag-pinned to :latest. `docker compose pull`
    # fetches whatever master CI published most recently.
    # For local dev: `bash scripts/build-controller.sh` tags the local build
    # with this same GHCR ref, so `docker compose run` reuses the local image
    # without re-pulling.
    # Note: pinning to @sha256:<digest> would be more immutable but turns
    # every commit into a compose-edit treadmill on a single-operator setup
    # where GHCR is private and you are the only pusher. Not worth it for
    # this scope. If you cut a release tag (`git tag v0.1.0 && git push --tags`)
    # the build workflow also publishes `:0.1.0` — pin to that instead if
    # you want stability between releases without per-commit churn.
    image: ghcr.io/d954mas/naiw-controller:latest
    container_name: naiw-controller
    # Controller is one-shot: every `naiw-tasks` call spawns a fresh container
    # via `docker compose run --rm`. No `command:` — the ENTRYPOINT in
    # image/controller.Dockerfile is `naiw-tasks` and positional args from
    # `compose run` become the subcommand.
    networks: [naiw-internal]
    depends_on:
      - naiw-docker-proxy
    volumes:
      # Bind-mount source resolves via the operator's shell env. In-container
      # path stays /naiw-data via the service-level `environment:` below.
      - ${NAIW_DATA:-${HOME}/naiw-data}:/naiw-data
    environment:
      # In-container NAIW_DATA is always /naiw-data (the mount target);
      # operator's host-side $NAIW_DATA controls the bind-mount SOURCE.
      NAIW_DATA: /naiw-data
      # Operator-visible override path; config.py also reads this env var.
      NAIW_DOCKER_PROXY_URL: tcp://naiw-docker-proxy:2375
    # Hardening (controller-scoped — smaller limits than task containers
    # because the controller does not run Pi or build wheels at runtime).
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=32m,mode=755
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
