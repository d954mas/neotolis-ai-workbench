[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "naiw_common"
version = "0.1.0"
description = "NAIW shared schema and path constants (events.jsonl wire format, /io paths)."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "../../README.md"

[tool.setuptools]
packages = ["naiw_common"]
