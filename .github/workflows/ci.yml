name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        # Editable installs of the three in-tree packages so their transitive
        # deps (click, docker, PyYAML) are resolved from each pyproject.toml —
        # the source of truth — instead of being hand-maintained here.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest \
            -e ./src/naiw_common \
            -e ./src/naiw_signal \
            -e ./src/naiw_tasks

      - name: ruff
        run: ruff check src/ tests/

      - name: pytest (unit)
        run: pytest tests/unit/ -q

  smoke:
    runs-on: ubuntu-latest
    # Image builds here are layer-cached for CI speed (GHA backend, ~7-day
    # automatic eviction picks up Debian security patches roughly weekly).
    # Production deploys MUST rebuild from master with --no-cache so an
    # operator-driven release isn't pinned to a stale apt snapshot.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + naiw_tasks (for transitive PyYAML)
        # tests/smoke/test_compose_contract.py imports yaml. Rather than
        # hand-pin pyyaml here and risk version drift from
        # src/naiw_tasks/pyproject.toml, install the package editable so its
        # declared dependencies (PyYAML, click, docker, naiw_common) are
        # resolved from the single source of truth — same pattern as the
        # lint-and-test job below.
        run: |
          python -m pip install --upgrade pip
          pip install pytest \
            -e ./src/naiw_common \
            -e ./src/naiw_tasks

      - name: Verify docker tooling
        run: |
          docker --version
          docker compose version

      - name: Read PI_VERSION
        id: pi
        run: echo "version=$(cat image/PI_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build naiw-task-image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          tags: |
            naiw-task-image:0.1.0
            naiw-task-image:latest
          build-args: |
            PI_VERSION=${{ steps.pi.outputs.version }}
            NAIW_VERSION=0.1.0
            NAIW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build naiw-controller (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/controller.Dockerfile
          # Tag with the GHCR ref so the deploy/docker-compose.yml reference
          # (ghcr.io/d954mas/naiw-controller:latest) resolves against the
          # just-built image without a compose override. The bare local tags
          # are kept for parity with scripts/build-controller.sh.
          tags: |
            naiw-controller:0.1.0
            naiw-controller:latest
            ghcr.io/d954mas/naiw-controller:latest
          build-args: |
            NAIW_VERSION=0.1.0
            NAIW_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=naiw-controller
          cache-to: type=gha,mode=max,scope=naiw-controller
          load: true

      - name: Proxy smoke (no pytest wrapper)
        run: bash tests/smoke/run-proxy-smoke.sh

      # pytest -m smoke runs test_image.py, test_hardened.py, and
      # test_containerized.py — each invokes its bash harness via subprocess.
      # One step verifies both the bash scripts AND the pytest wrappers — no
      # duplication. The `Build naiw-controller` step above tags the local
      # build with the same GHCR ref the compose file pins to, so no override
      # file is needed and `docker compose run` resolves to the local image.
      - name: Image + hardened + containerized smoke via pytest
        run: pytest tests/smoke/ -v -m smoke
