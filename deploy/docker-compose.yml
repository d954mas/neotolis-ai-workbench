# NAIW management stack. The proxy never joins naiw-task-net.

networks:
  naiw-internal:
    name: naiw-internal
    driver: bridge
  naiw-task-net:
    name: naiw-task-net
    driver: bridge

services:
  naiw-docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: naiw-docker-proxy
    restart: unless-stopped
    networks: [naiw-internal]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PING: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "0"
      VOLUMES: "0"

  naiw-controller:
    image: ghcr.io/d954mas/naiw-controller:latest
    networks: [naiw-internal]
    depends_on:
      - naiw-docker-proxy
    volumes:
      - ${NAIW_DATA:-${HOME}/naiw-data}:/naiw-data
    environment:
      NAIW_DATA: /naiw-data
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=32m,mode=755
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
